<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>DSD Remote — Instrument Surface</title>
    <link rel="stylesheet" href="style.css?v=0.1.2">
</head>
<body>
    <div id="app">
        <!-- Compact Hardware Header Bar -->
        <header class="top-bar">
            <div class="brand-section">
                <span class="brand-logo">DSD Mixer</span>
                <span class="brand-subtitle">VIRTUAL DIGITAL CONSOLE</span>
                <span class="brand-version" id="brand-version">v0.1.2</span>
            </div>

            <!-- Status Indicator & Action Tools -->
            <div class="top-actions">
                <div class="status-pill" onclick="openConnectionModal()" style="cursor: pointer;" title="Connection Status">
                    <div class="status-dot" id="status-dot"></div>
                    <span class="transport-badge" id="transport-badge">Wi-Fi</span>
                    <span id="status-text">OFFLINE</span>
                    <span class="latency-label" id="latency-label">-- ms</span>
                </div>

                <button class="icon-btn" id="fullscreen-btn" title="Toggle Fullscreen">⛶</button>
                <button class="icon-btn" onclick="openConnectionModal()" title="Settings & Connection">⚙</button>
            </div>
        </header>

        <!-- 4x4 Stream Deck 16-Channel Surface -->
        <main class="deck-container">
            <div class="deck-grid" id="deck-grid">
                <!-- 16 Channel Tiles rendered dynamically -->
            </div>
        </main>
    </div>

    <!-- Connection & PIN Pairing Modal -->
    <div class="modal-overlay hidden" id="connection-modal">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title">DSD Mixer Connection</span>
                <button class="modal-close-btn" onclick="hideConnectionModal()">✕</button>
            </div>
            <div class="modal-body">
                <!-- Transport Mode Selector -->
                <div class="input-group">
                    <label class="input-label">Connection Transport</label>
                    <div class="transport-selector">
                        <button type="button" class="transport-btn active" id="transport-wifi-btn" onclick="setTransportMode('wifi')">Wi-Fi (LAN)</button>
                        <button type="button" class="transport-btn" id="transport-usb-btn" onclick="setTransportMode('usb')">USB (ADB Reverse)</button>
                    </div>
                </div>

                <div class="input-group" id="ws-url-group">
                    <label class="input-label" for="ws-url-input" id="ws-url-label">Server WebSocket URL</label>
                    <input type="text" class="text-input" id="ws-url-input" placeholder="ws://192.168.1.xxx:9100">
                    <span class="input-hint" id="ws-url-hint">Enter your PC's LAN IP address shown in the desktop DSD Mixer REMOTE dialog.</span>
                </div>

                <div class="input-group">
                    <label class="input-label">6-Digit Pairing PIN</label>
                    <div class="pin-inputs">
                        <input type="tel" maxlength="1" class="pin-digit" autofocus>
                        <input type="tel" maxlength="1" class="pin-digit">
                        <input type="tel" maxlength="1" class="pin-digit">
                        <input type="tel" maxlength="1" class="pin-digit">
                        <input type="tel" maxlength="1" class="pin-digit">
                        <input type="tel" maxlength="1" class="pin-digit">
                    </div>
                </div>

                <button class="primary-btn" id="connect-btn">CONNECT & SYNC</button>
            </div>
        </div>
    </div>

    <!-- Scripts with Cache-Busting Version Query -->
    <script src="dsdcp.js?v=0.1.2"></script>
    <script src="app.js?v=0.1.2"></script>
</body>
</html>
